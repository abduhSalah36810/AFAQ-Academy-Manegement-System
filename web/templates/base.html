<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% block meta %}
  <meta name="description" content="أكاديمية آفاق — المنظومة الإدارية المتكاملة لإدارة الكورسات والتدريب" />
  <meta property="og:title" content="أكاديمية آفاق | AFAQ Academy" />
  <meta property="og:type" content="website" />
  {% endblock %}
  <title>{% block title %}أكاديمية آفاق{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css" />
  {% block head %}{% endblock %}
</head>
<body>

{% block body %}{% endblock %}

<div id="toast-container" class="toast-container"></div>

{% if flash_message %}
<div data-flash data-flash-message="{{ flash_message }}" data-flash-type="{{ flash_type or 'success' }}" style="display:none;"></div>
{% endif %}

<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
